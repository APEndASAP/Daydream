  <title>白日梦</title>
  <script>
    /* 20260929ah：数据源门卫（最早执行，任何入口都先过这里）。
       IndexedDB 按 origin 隔离，正式数据只在 127.0.0.1:8902。从别的入口打开本文件
       （如对话里的文件卡片落在宿主静态服务 [::1]:55625、或 localhost:8902、或 file://）时：
       ① 先 location.replace 跳回 8902（正常浏览器直接成功，到此结束）；
       ② 若跳转被宿主预览面板拦截（iframe sandbox 等场景），DOMContentLoaded 后
          注入全屏「数据源保护页」——不再渲染应用、不建库，从根源上杜绝
          "点了文件卡片 → 空库界面 → 以为数据又串了/丢了"。
       正式数据永远只在 8902：请用对话里的「浏览器预览」卡（http://127.0.0.1:8902）进入。 */
    (function () {
      try {
        // 20260930cd：GitHub Pages（*.github.io）为正式发布入口，与 8902 同为合法数据源，不再拦截跳转
        var ok = (location.hostname === '127.0.0.1' && location.port === '8902')
          || /(^|\.)github\.io$/i.test(location.hostname);
        window.__BM_ORIGIN_OK = ok;
        if (ok) return;
        location.replace('http://127.0.0.1:8902/index.html?v=20260930cd' + location.hash);
        // replace 被拦时页面会留下：DOMContentLoaded 后把 body 换成保护页
        document.addEventListener('DOMContentLoaded', function () {
          if (window.__BM_ORIGIN_OK) return;   // 已成功跳走则不会执行到这里
          try {
            document.body.innerHTML = ''
              + '<div style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(ellipse at 50% 0%,#2b2340 0%,#1a1626 55%,#121016 100%);font-family:\'PingFang SC\',\'Microsoft YaHei\',system-ui,sans-serif;text-align:center;padding:28px;user-select:none;">'
              +   '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" style="filter:drop-shadow(0 0 16px rgba(167,139,250,.55));"><defs><linearGradient id="bmg" x1="6" y1="2" x2="19" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#8b74e8"/></linearGradient></defs><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="url(#bmg)"/></svg>'
              +   '<div style="margin-top:18px;font-size:22px;letter-spacing:8px;text-indent:8px;font-weight:300;color:#c4b5fd;">数据源保护</div>'
              +   '<div style="margin-top:14px;max-width:420px;font-size:13px;line-height:1.9;color:rgba(255,255,255,.72);">本页从 <b style="color:#c4b5fd;word-break:break-all;">' + (location.protocol === 'file:' ? '本地文件' : location.hostname + (location.port ? ':' + location.port : '')) + '</b> 打开，与正式数据空间（127.0.0.1:8902）<b>互不相通</b>。<br>为避免产生第二套空数据，软件已在当前入口停止加载。<br><b style="color:#e9e4ff;">你的数据一份没丢，全部都在 8902。</b></div>'
              +   '<button id="bm-go" style="margin-top:26px;padding:12px 34px;border:none;border-radius:999px;background:linear-gradient(135deg,#8b74e8,#a78bfa);color:#fff;font-size:14px;letter-spacing:2px;cursor:pointer;">进入白日梦（正式数据）</button>'
              +   '<div style="margin-top:16px;font-size:11px;line-height:1.8;color:rgba(255,255,255,.45);max-width:420px;">若点击无效（当前面板禁止跳转），请回到 AI 对话里点 <b style="color:#c4b5fd;">http://127.0.0.1:8902</b> 预览卡进入——<br>只有这个入口读写正式数据。</div>'
              + '</div>';
            var btn = document.getElementById('bm-go');
            if (btn) btn.onclick = function () { location.replace('http://127.0.0.1:8902/index.html?v=20260930cd'); };
          } catch (e) {}
        });
      } catch (e) {}
    })();
  </script>

</head>
<body>
  <div id="app">
    <!-- 星光背景 -->
    <div class="starfield" id="starfield"></div>

    <!-- 全局页面背景层（聊天导航/朋友圈的自定义背景铺满全屏，含底栏后方，玻璃透出） -->
    <div id="app-fullbg"></div>

    <!-- 20260929z 删除应用内旧开屏（与启动器动画重复）；20260929br 开屏动画回归，
         独立承担于 js/splash.js，启动器已改为直接跳转不再播动画；
         20260929bs 重制为「宇宙手稿 · Heliodream」（双彗星入轨+天文手稿日心系+ENTROPY 反转）；
         20260930bt 换装 v2「星轨手稿」（双星互绕入场→最高点交汇→星盘白反转+拉丁箴言+BGM）；
         20260930bu 细节收尾（删原生 emoji / 书信改固定间隔 / 消息时间戳 / BGM 提响度+结尾余韵 / 聊天页内当前角色发消息提示音）；
         20260930bv 修复开屏（点击不再误跳过、点击任意处激活 BGM 出声）；
         20260930bw 总设置加「开屏音乐自动播放」开关（splash 读开关更积极 resume+播放；修正提示文案）；
         20260930bx 通话灰字/挂断图标四模式可读性；开屏音乐语义纠正=开屏结束后继续循环播放全程（主页顶栏小型开关）+每次进入显示点按提醒；总设置加白名单引导+开屏音乐/软件内提示音更换上传；悬浮窗2号设置移到通话悬浮窗模式下方+功能示意图；
         20260930by 音乐开关补全语义：开=立即从头播放（无论开屏是否结束）、已在播则延续不重播；关=淡出式立即停止；
         20260930bz 世界树检索细则落地：权限三态（条目「跟随文件夹/单独设置」区分）、本地关键词预提取（高频词+人名地名）、玩家手动补充关键词、AI 精炼后台串行队列（摘要+核心关键词，>200字防重复）、开发者命中日志；
         20260930ca 世界树标签补全：跟随条目也显示文件夹有效权限（跟随·全部可读/N 个访客/禁读），未设置过权限的文件夹不再误标「AI·禁读」；超频动画下方新增「跳过动画」按钮（点击快速结束本段动画，礼物/惊喜弹窗照常弹出）；
         20260930cb 问卷感想（玩家答完角色逐题回感想：字卡抽卡/AI 生成）；问卷新增「添加选择题」（问题框+逐行选项框最多 5 个）；创建角色页新增「角色开场白」（留空则从字卡库抽一张打招呼）；消息送达/已读标识（本地状态机：写库成功=送达，访客回复/主动发消息生成前=已读）；生成中打字点点跟随气泡文字色修复可读性；总设置新增两条独立音乐音量条（开屏动画 / 软件内，开屏默认 130% 更响）；
         20260930cc 修复角色自答问卷大 bug（角色向玩家提问的问卷曾被答题队列捞起 20 秒后自答——队列只收 from:'me' + _answerSurvey 兜底守卫）；删除送达/已读标识（状态机与 UI 全部移除）；问卷批量选择就地更新不跳顶+选中框改 inset 阴影修复两侧被裁；占卜示例问题换中性文案（最近的运势怎么样）；
         20260930cd 撤回提示可读性（硬编码浅灰改变量四模式自适应）；弹窗滚动位全局修复（超频礼物库点详情/送礼物取消返回、礼物柜重建、世界树根↔文件夹往返、问卷详情返回列表——从哪返回就恢复到哪不跳顶）；BGM 增响（压缩器补偿增益+6dB、前半段初始增益 1.25、淡入 0.4s→0.12s、更早起播、开屏默认 150%、滑杆上限 200%）；音频引导删站点地址；数据源门卫放行 GitHub Pages（部署入口） -->

    <!-- 个人主页（3.3：启动后默认进入；8.1 布局） -->
    <div class="view active" id="view-home">
      <div class="topbar" id="home-topbar">
        <button class="btn" id="btn-anniversary" title="纪念日" style="background:var(--purple-dim);color:var(--purple-soft);padding:7px 14px;font-size:13px;gap:6px;">
