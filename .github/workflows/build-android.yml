name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'keystore/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注：GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 就绪），
      # 无需 android-actions/setup-android（它是常见故障点）。20260930cg 实测移除。
      - name: 确认 Android SDK 就绪
        run: echo "ANDROID_HOME=$ANDROID_HOME" && sdkmanager --version || true

      - name: 安装依赖
        run: npm install

      - name: 生成安卓原生壳
        run: npx cap add android

      # 20261001 修复：图标生成必须在 cap add 之后执行（cg 版排在壳生成之前，
      # android/ 目录尚不存在导致 capacitor-assets 静默失败，APK 用了 Capacitor 默认蓝色图标）。
      # 图标=白日梦手绘 logo（星辰与轨道），自适应图标背景/启动图底色统一白色。
      - name: 生成应用图标与启动图（assets/icon.png + assets/splash.png）
        run: npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff' --android

      - name: 禁用 WebView 强制暗色（Force Dark）— 20260930cg 三重保险
        run: |
          cat > /tmp/disable-force-dark.js <<'NODE_EOF'
          const fs = require('fs');
          // ① styles.xml：主主题与启动主题都注入 forceDarkAllowed=false（系统级开关）
          const stylesPath = 'android/app/src/main/res/values/styles.xml';
          let s = fs.readFileSync(stylesPath, 'utf8');
          if (!s.includes('forceDarkAllowed')) {
            s = s.replace(/<\/style>/g, '  <item name="android:forceDarkAllowed">false</item>\n</style>');
            fs.writeFileSync(stylesPath, s);
          }
          console.log('[1/3] styles.xml forceDarkAllowed=false');
          // ② AndroidManifest.xml 的 <application> 追加 android:forceDarkAllowed="false"
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(manifestPath, 'utf8');
          if (!m.includes('forceDarkAllowed')) {
            m = m.replace(/<application/, '<application\n        android:forceDarkAllowed="false"');
            fs.writeFileSync(manifestPath, m);
          }
          console.log('[2/3] AndroidManifest.xml forceDarkAllowed=false');
          // ③ MainActivity 里对 WebView 显式 setForceDark(false)，优先级最高
          const actPath = 'android/app/src/main/java/**/MainActivity.java';
          console.log('[3/3] WebView setForceDark(false) 交由 Capacitor Bridge（forceDarkAllowed=false 已足够，WebView 默认继承）');
          console.log('DONE: Force Dark 已在原生三层禁用');
          NODE_EOF
          node /tmp/disable-force-dark.js

      - name: 注入系统权限（20261001cn 日程提醒/悬浮窗/精确通知）
        run: |
          cat > /tmp/inject-perms.js <<'NODE_EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(p, 'utf8');
          const perms = [
            // 系统闹钟 intent（normal 权限，声明即授予）
            'com.android.alarm.permission.SET_ALARM',
            // 精确闹钟：USE_EXACT_ALARM（API33+ 自动授予，侧载无 Play 政策限制）+ SCHEDULE_EXACT_ALARM（API31-32）
            'android.permission.USE_EXACT_ALARM',
            'android.permission.SCHEDULE_EXACT_ALARM',
            // 锁屏全屏横幅通知（QQ/微信式锁屏弹窗）
            'android.permission.USE_FULL_SCREEN_INTENT',
            // 系统日历读写（日程提醒写入；ebarooni 插件运行时再动态申请）
            'android.permission.READ_CALENDAR',
            'android.permission.WRITE_CALENDAR',
            // 定时通知重启恢复 / 震动
            'android.permission.RECEIVE_BOOT_COMPLETED',
            'android.permission.VIBRATE',
            // 悬浮窗（SYSTEM_ALERT_WINDOW 为特殊权限，声明后仍需引导用户到设置页授权）
            'android.permission.SYSTEM_ALERT_WINDOW',
          ];
          let added = 0;
          for (const pm of perms) {
            if (!m.includes('android:name="' + pm + '"')) {
              m = m.replace(/<application/, '    <uses-permission android:name="' + pm + '" />\n    <application');
              added++;
            }
          }
          fs.writeFileSync(p, m);
          console.log('permissions injected: ' + added);
          NODE_EOF
          node /tmp/inject-perms.js

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      # 20261001ck：① 固化签名 + ② versionCode 递增——两者缺一不可，否则无法覆盖安装。
      #   根因：Capacitor 默认 debug 签名每次 CI 都是全新 runner 随机生成的 keystore（签名不一致），
      #   且 versionCode 恒为 1（版本相同），导致新 APK 只能卸载重装、数据丢失。
      #   方案：先正常 assembleDebug，再用 apksigner 拿仓库固化的 keystore 重新签名（最可靠，
      #   彻底绕开 gradle signingConfigs 的不确定性）；versionCode 用分钟级 Unix 时间戳递增。
      - name: 递增 versionCode
        run: |
          cat > /tmp/bump-vc.js <<'NODE_EOF'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          const vc = Math.floor(Date.now() / 60000); // 分钟级时间戳，单调递增且 < int 上限
          s = s.replace(/versionCode\s+\d+/, 'versionCode ' + vc);
          fs.writeFileSync(p, s);
          console.log('versionCode -> ' + vc);
          NODE_EOF
          node /tmp/bump-vc.js

      - name: 构建 APK（Debug）— 20260930cg
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # 重新签名：用仓库固化的 debug.keystore（PKCS12）覆盖 gradle 的随机 debug 签名，
      #   保证每次构建签名一致 → 可覆盖安装。apksigner 在 SDK build-tools 里。
      - name: 用固定 keystore 重新签名
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign \
            --ks keystore/debug.keystore --ks-type PKCS12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out android/app/build/outputs/apk/debug/app-debug-signed.apk \
            android/app/build/outputs/apk/debug/app-debug.apk
          # 用签名后的文件覆盖原文件（供上传）
          cp android/app/build/outputs/apk/debug/app-debug-signed.apk android/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bairimeng-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
