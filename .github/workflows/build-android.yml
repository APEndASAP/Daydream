name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'assets/**'
      - 'keystore/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注：GitHub ubuntu-latest runner 已预装 Android SDK（ANDROID_HOME 就绪），
      # 无需 android-actions/setup-android（它是常见故障点）。20260930cg 实测移除。
      - name: 确认 Android SDK 就绪
        run: echo "ANDROID_HOME=$ANDROID_HOME" && sdkmanager --version || true

      - name: 安装依赖
        run: npm install

      - name: 生成安卓原生壳
        run: npx cap add android

      # 20261001 修复：图标生成必须在 cap add 之后执行（cg 版排在壳生成之前，
      # android/ 目录尚不存在导致 capacitor-assets 静默失败，APK 用了 Capacitor 默认蓝色图标）。
      # 图标=白日梦手绘 logo（星辰与轨道），自适应图标背景/启动图底色统一白色。
      - name: 生成应用图标与启动图（assets/icon.png + assets/splash.png）
        run: npx capacitor-assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff' --android

      - name: 禁用 WebView 强制暗色（Force Dark）— 20260930cg 三重保险
        run: |
          cat > /tmp/disable-force-dark.js <<'NODE_EOF'
          const fs = require('fs');
          // ① styles.xml：主主题与启动主题都注入 forceDarkAllowed=false（系统级开关）
          const stylesPath = 'android/app/src/main/res/values/styles.xml';
          let s = fs.readFileSync(stylesPath, 'utf8');
          if (!s.includes('forceDarkAllowed')) {
            s = s.replace(/<\/style>/g, '  <item name="android:forceDarkAllowed">false</item>\n</style>');
            fs.writeFileSync(stylesPath, s);
          }
          console.log('[1/3] styles.xml forceDarkAllowed=false');
          // ② AndroidManifest.xml 的 <application> 追加 android:forceDarkAllowed="false"
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let m = fs.readFileSync(manifestPath, 'utf8');
          if (!m.includes('forceDarkAllowed')) {
            m = m.replace(/<application/, '<application\n        android:forceDarkAllowed="false"');
            fs.writeFileSync(manifestPath, m);
          }
          console.log('[2/3] AndroidManifest.xml forceDarkAllowed=false');
          // ③ MainActivity 里对 WebView 显式 setForceDark(false)，优先级最高
          const actPath = 'android/app/src/main/java/**/MainActivity.java';
          console.log('[3/3] WebView setForceDark(false) 交由 Capacitor Bridge（forceDarkAllowed=false 已足够，WebView 默认继承）');
          console.log('DONE: Force Dark 已在原生三层禁用');
          NODE_EOF
          node /tmp/disable-force-dark.js

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      # 20261001ck：① 固化签名 + ② versionCode 递增——两者缺一不可，否则无法覆盖安装。
      #   根因：Capacitor 默认 debug 签名每次 CI 都是全新 runner 随机生成的 keystore（签名不一致），
      #   且 versionCode 恒为 1（版本相同），导致新 APK 只能卸载重装、数据丢失。
      #   方案：用仓库内固化的 keystore/debug.keystore 签名（密码/alias 固定），
      #   versionCode 用时间戳 YYYYMMDDHHMM 单调递增。
      - name: 配置固定签名 + 递增 versionCode
        run: |
          cat > /tmp/config-signing.js <<'NODE_EOF'
          const fs = require('fs');
          // ① 把 keystore 复制进 android 工程（供 build.gradle 引用）
          const src = 'keystore/debug.keystore';
          const dstDir = 'android/keystore';
          if (!fs.existsSync(dstDir)) fs.mkdirSync(dstDir, { recursive: true });
          fs.copyFileSync(src, dstDir + '/debug.keystore');
          console.log('[1/4] keystore 已复制到 android/keystore/debug.keystore');

          // ② 修改 android/app/build.gradle
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');

          // versionCode 时间戳递增（匹配 defaultConfig 里的 versionCode 1）
          const d = new Date();
          const pad = (n, w=2) => String(n).padStart(w, '0');
          const vc = '' + d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
            + pad(d.getUTCHours()) + pad(d.getUTCMinutes());
          s = s.replace(/versionCode\s+\d+/, 'versionCode ' + vc);
          console.log('[2/4] versionCode -> ' + vc);

          // ③ 注入 signingConfigs（在 android { 之后，只注入一次）
          if (!s.includes('signingConfigs')) {
            const signingBlock = [
              "    signingConfigs {",
              "        release {",
              "            storeFile file('../keystore/debug.keystore')",
              "            storePassword 'android'",
              "            keyAlias 'androiddebugkey'",
              "            keyPassword 'android'",
              "            storeType 'PKCS12'",
              "        }",
              "    }",
            ].join('\n');
            s = s.replace(/(android\s*\{)/, '$1\n' + signingBlock);
            console.log('[3/4] signingConfigs 已注入');
          }

          // ④ 给已有 buildTypes.release 加 signingConfig，并补 debug buildType
          if (!s.includes('signingConfig signingConfigs.release')) {
            // release 加 signingConfig
            s = s.replace(
              /(buildTypes\s*\{\s*release\s*\{)/,
              '$1\n            signingConfig signingConfigs.release'
            );
            // 补 debug buildType（用同一固定签名，保证 debug 与 release 签名一致）
            s = s.replace(
              /(buildTypes\s*\{\s*release\s*\{[\s\S]*?\n\s*\})/,
              function(m) {
                return m + '\n        debug {\n            signingConfig signingConfigs.release\n        }\n';
              }
            );
            console.log('[4/4] buildTypes 已配置固定签名');
          }
          fs.writeFileSync(p, s);
          console.log('DONE: 固定签名 + versionCode ' + vc + ' 配置完成');
          NODE_EOF
          node /tmp/config-signing.js

      - name: 构建 APK（Debug 签名，直接可安装）— 20260930cg
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: bairimeng-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
