/* ============ 20261104 前台互动（陪伴动作/陪伴回复，字卡库抽取 + 可配间隔） ============ */
function compInterval(){
  const lo = Math.max(1, compInteractMin || 8);
  const hi = Math.max(lo, compInteractMax || 20);
  return (lo + Math.random() * (hi - lo)) * 60 * 1000;  // 分钟 → 毫秒
}
function startCompInteract(){
  stopCompInteract();
  if(!companionOn) return;
  const loop = () => {
    if(!focusActive || !companionOn){ compInteractTimer = null; return; }
    triggerCompInteract();
    compInteractTimer = setTimeout(loop, compInterval());
  };
  compInteractTimer = setTimeout(loop, compInterval());
}
function stopCompInteract(){
  if(compInteractTimer){ clearTimeout(compInteractTimer); compInteractTimer = null; }
}
/* 抽一条前台互动气泡：动作描述 + 台词
   20261105：AI 模式下让 AI 自己生成（贴合人设），postMessage 请求主项目异步回填；
   字卡模式从字卡库「陪伴动作」「陪伴回复」抽，无自定义用内置兜底。 */
function triggerCompInteract(){
  const wrap = document.getElementById('cvBubbles');
  if(!wrap) return;
  if(aiMode){
    // AI 模式：请求主项目用 AI 生成一句「陪伴动作+台词」，异步回填气泡
    const eid = compInteractSeq++;
    if(window.parent && window.parent !== window){
      const name = (selectedChar !== null && CHARS[selectedChar]) ? (CHARS[selectedChar].name || 'TA') : 'TA';
      window.parent.postMessage({ type:'pomodoro-gen-comp-interact', payload:{ eventId:eid, charName:name } }, '*');
    } else {
      // 独立原型无父窗口：降级字卡抽取
      emitCompBubbleFromPool(wrap);
    }
    return;
  }
  emitCompBubbleFromPool(wrap);
}
/* 字卡模式 / AI 失败兜底：从字卡库抽「动作 + 台词」气泡 */
function emitCompBubbleFromPool(wrap){
  const acts = (compActions && compActions.length) ? compActions : [
    '（托着腮看着你，觉得你特别好看，但又怕打扰你）',
    '（悄悄把温水放在你手边，安静退到一旁）',
    '（撑起一层结界，把喧嚣都挡在外面）'
  ];
  const reps = (compReplies && compReplies.length) ? compReplies : ['累了就歇会儿', '我一直在呢', '别太拼了'];
  const act = acts[Math.floor(Math.random() * acts.length)];
  const rep = reps[Math.floor(Math.random() * reps.length)];
  // 两种气泡：动作（带括号描述）+ 台词（短句）
  emitCompBubbles(wrap, [act, rep]);
}
/* 把 lines 数组渲染成气泡（最多留 3 条） */
function emitCompBubbles(wrap, lines){
  while(wrap.children.length >= 3){ wrap.removeChild(wrap.firstChild); }
  lines.forEach((m, i) => {
    const b = document.createElement('div');
    b.className = 'cv-bubble';
    b.textContent = m;
    b.style.top = `${6 + i * 30}%`;
    b.style.left = i % 2 === 0 ? '2%' : '24%';
    wrap.appendChild(b);
  });
}
/* AI 生成回填：主项目 pomodoro-comp-interact-result 回传后，填充前台互动气泡 */
function fillCompInteractResult(eventId, lines){
  const wrap = document.getElementById('cvBubbles');
  if(!wrap) return;
  emitCompBubbles(wrap, (Array.isArray(lines) && lines.length) ? lines : ['累了就歇会儿']);
}

/* ============ 结算页（角色文件夹 + 每次结算） ============ */
const settleRecords = [];  // {id, charIdx, folderId, date, time, durMin, durSec, task, events:[], results:[{text, imgs:[], reply}]}
let settleIdSeq = 1;
/* 文件夹：角色默认(type=char,绑charIdx,不可删) + 自定义(type=custom,可命名/删除/换封面) */
const folders = [];        // {id, type:'char'|'custom', charIdx?, name, cover?, color?}
let folderIdSeq = 1;
/* 20261104：结算归档持久化——settleRecords/folders 原为纯内存，刷新即丢。
   iframe 与主项目同源，localStorage 可共享；每次增删改后立即落盘，启动时恢复。
   注意：记录里存的 charIdx 是相对 CHARS 索引，CHARS 由主项目动态下发，刷新后按 id 重映射。 */
const SETTLE_LS_KEY = 'bairimeng_pomodoro_settle_v1';
function persistSettle(){
  try {
    localStorage.setItem(SETTLE_LS_KEY, JSON.stringify({
      settleRecords, folders, settleIdSeq, folderIdSeq
    }));
  } catch(e) {}
}
function restoreSettle(){
  try {
    const raw = localStorage.getItem(SETTLE_LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.settleIdSeq) settleIdSeq = d.settleIdSeq;
    if(d.folderIdSeq) folderIdSeq = d.folderIdSeq;
    if(Array.isArray(d.folders)) for(const f of d.folders) folders.push(f);
    if(Array.isArray(d.settleRecords)) for(const r of d.settleRecords) settleRecords.push(r);
  } catch(e) {}
}
function makeCharFolder(charIdx){
  const c = charIdx>=0 ? CHARS[charIdx] : { name:'自由', color:'#8b7a66', emoji:'✨' };
  const f = { id: folderIdSeq++, type:'char', charIdx, name:c.name, cover:null, color:c.color, emoji:c.emoji, avatar: c.avatar || null };
  folders.push(f);
  return f;
}
function makeCustomFolder(name){
  // 绑定当前陪伴角色（角色间结算不互通）：在哪个角色窗口建文件夹，就归该角色。
  //   20261104 修复：改用 selectedChar（当前选中的角色）而非 currentChar（仅在 openClearView 时
  //   从 selectedChar 同步）——用户没进专注页就直接建文件夹时 currentChar 仍是 -1，导致
  //   charIdx 误存 null、圆形绿标显示四芒星而非角色头像。
  const cIdx = (selectedChar !== null && selectedChar !== undefined && selectedChar >= 0)
    ? selectedChar : (currentChar >= 0 ? currentChar : null);
  const c = cIdx !== null ? CHARS[cIdx] : null;
  const f = {
    id: folderIdSeq++, type:'custom', charIdx: cIdx, name,
    cover:null, color: c ? c.color : null, emoji: c ? c.emoji : null, avatar: c ? (c.avatar || null) : null
  };
  folders.push(f);
  return f;
}
/* 获取某角色对应的默认文件夹（无则建） */
function charFolderOf(charIdx){
  let f = folders.find(f=>f.type==='char' && f.charIdx===charIdx);
  if(!f) f = makeCharFolder(charIdx);
  return f;
}
/* 某文件夹内的结算记录 */
function recordsOfFolder(fid){
  return settleRecords.filter(r=>r.folderId===fid);
}
function addSettleRecord(){
  const c = currentChar;   // 用当前专注的角色
  const durSec = focusCountdown ? (focusMin*60 - Math.max(0, remaining)) : companionElapsed;
  const fid = charFolderOf(c).id;   // 挂到角色默认文件夹
  // 20261104：结算前兜底——AI 模式可能有尚未回填的「角色做自己的事」事件，补一句兜底文案
  for(const ev of sessionEvents){
    if(ev._pendingAI && !ev.text) ev.text = '在忙自己的一点小事';
    delete ev._pendingAI;
  }
  const rec = {
    id: settleIdSeq++,
    charIdx: c,
    folderId: fid,
    date: `${new Date().getMonth()+1}月${new Date().getDate()}日`,
    time: `${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`,
    durMin: Math.max(1, Math.floor(durSec/60)),
    durSec: durSec,
    task: currentTask || '自由专注',
    mode: focusMode,
    events: sessionEvents.slice(),       // 20261104：读取陪伴过程后台真实发生的事件（不再结算时随机生成）
    results: [],                        // 玩家上传的成果 {text, imgs, reply}
    reply: null,                        // 角色对本次专注的留言
  };
  settleRecords.push(rec);
  persistSettle();                      // 20261104：结算即落盘，刷新不丢
  // 20261104：iframe 接入主项目时，把结算回传给父窗口落库（focus_session）
  postSettle(rec);
  return rec;
}

/* 20261104：结算回传主项目。父窗口非本窗口时 postMessage；独立原型无父窗口则静默 */
function postSettle(rec){
  if(!(window.parent && window.parent !== window)) return;
  const c = rec.charIdx>=0 ? CHARS[rec.charIdx] : null;
  window.parent.postMessage({
    type: 'pomodoro-settle',
    payload: {
      charId: c ? (c.id || null) : null,
      charName: c ? c.name : '自由',
      taskName: rec.task,
      mode: rec.mode,
      durSec: rec.durSec,
      durMin: rec.durMin,
      date: rec.date,
      time: rec.time,
      events: (rec.events||[]).map(e=>e.text),
      reply: rec.reply || '',
      results: (rec.results||[]).map(r=>({ text:r.text, imgs:(r.imgs||[]).slice(), reply:r.reply||'' })),
      time0: Date.now(),
    }
  }, '*');
}

/* 角色对成果的留言：字卡模式抽 2~3 条，AI 模式由 AI 生成（原型用字卡池） */
function genReply(charIdx){
  const pool = [
    '真厉害，我看着都替你开心。',
    '原来你专注的时候是这个样子呀。',
    '这个成果我收下啦，会好好珍藏的。',
    '你做得很好，我一直都在看着呢。',
    '下次也想和你一起做点什么。',
    '（轻轻把成果收进怀里）',
  ];
  const n = 2 + Math.floor(Math.random()*2);  // 2~3 条
  const parts = [];
  const used = new Set();
  for(let i=0;i<n;i++){
    let idx = Math.floor(Math.random()*pool.length);
    while(used.has(idx)) idx = Math.floor(Math.random()*pool.length);
    used.add(idx);
    parts.push(pool[idx]);
  }
  return parts.join('\n');
}

    const ci = (f.charIdx === null || f.charIdx === undefined) ? -1 : f.charIdx;

    // 纸张：只保留头像 + 一行分类名称（去掉副标题小字）

/* 颜色混合辅助：amount 正=向白色靠近，负=向黑色靠近 */
function mixColor(hex, to, amount){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const t = to==='#ffffff' ? 255 : 0;
  const nr = Math.round(r + (t-r)*Math.abs(amount));
  const ng = Math.round(g + (t-g)*Math.abs(amount));
  const nb = Math.round(b + (t-b)*Math.abs(amount));
  return `rgb(${nr},${ng},${nb})`;
}

/* 20261105：番茄钟统一栈式返回入口——按「弹窗 → 结算页栈 → 番茄钟主页 → 通知父窗口」逐层回退。
   用户要求：点进专注结算单独页面后回退，应 详情→列表→文件夹→番茄页→聊天页，而不是一步退出整个番茄钟。 */
function pomodoroBack(){
  // 20261105 锁机需求：专注清屏页（focusActive=true，即「点击开始专注」后的专注页）
  //   去掉手势识别/返回——侧滑、物理返回键都不回退，只有「退出专注」按钮能结束专注。
  //   其他页面（番茄钟主页、结算页、弹窗等）回退逻辑保持正常。
  if (focusActive) return;
  // 1) 各弹窗（选角色/白噪音/待办/新建文件夹/移动/成果输入）开着 → 只关弹窗
  const sheets = [
    ['charSheet', 'char-sheet'],
    ['noiseSheet', 'noise-sheet'],
    ['todoSheet', 'todo-sheet'],
    ['nfoldSheet', 'nfold-sheet'],
    ['moveSheet', 'move-sheet'],
    ['resultDialog', 'dialog'],
  ];
  for (const [id] of sheets) {
    const el = document.getElementById(id);
    if (el && el.classList.contains('show')) { el.classList.remove('show'); return; }
  }
  // 2) 本次结算页（信纸风卡片）开着 → 关闭，回到番茄钟主页
  const ss = document.getElementById('sessionSettle');
  if (ss && ss.classList.contains('show')) { ss.classList.remove('show'); return; }
  // 3) 结算页开着 → 栈式返回：栈里有层级就回上一级，栈空则关结算页回番茄钟主页
  const sv = document.getElementById('settleView');
  if (sv && sv.classList.contains('show')) {
    if (settleStack.length > 0) {
      const back = settleStack.pop();
      back();
    } else {
      sv.classList.remove('show');
      resetBatch();
    }
    return;
  }
  // 4) 番茄钟主页（无任何子层）→ 通知父窗口关闭番茄钟层（栈式返回上一层 = 聊天页）
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'pomodoro-close' }, '*');
  } else {
    alert('返回（原型演示）');
  }
}

/* 20261104：番茄钟滑动返回手势——从屏幕最左边缘向右滑（超过阈值）触发返回，
   与「‹ 返回」按钮等价，统一走 pomodoroBack() 栈式返回。 */
(function(){
  const EDGE = 56;        // 左侧边缘触发区宽度（px）；20261105 从 24 放宽到 56，与音乐页一致，修「手势没识别」
  const THRESH = 50;      // 横向滑动超过该距离才算返回；20261105 从 70 降到 50，更易触发
  let sx = 0, sy = 0, tracking = false;
  window.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    if (t.clientX <= EDGE) { tracking = true; sx = t.clientX; sy = t.clientY; }
    else tracking = false;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (!tracking) return;
    const t = e.touches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    // 横向为主（横向位移 > 纵向位移）才视为返回手势，避免与纵向滚动冲突
    if (dx > THRESH && Math.abs(dx) > Math.abs(dy) * 1.2) {
      tracking = false;
      pomodoroBack();
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { tracking = false; }, { passive: true });
})();

/* 20261105：接收父窗口（app.js）的系统返回键/侧滑返回指令，统一走 pomodoroBack 栈式返回。
   父窗口无法感知 iframe 内部的弹窗/结算页层级，所以把「返回」交给 iframe 自己处理：
   内部有弹窗/结算页就逐层回退，回到主页后再回发 pomodoro-close 通知父窗口关闭番茄钟层。 */
window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d) return;
  if (d.type === 'pomodoro-back') {
    pomodoroBack();
  } else if (d.type === 'pomodoro-lock-perm-result') {
    // 20261105：父窗口申请完「使用情况访问」权限后回传结果
    const cb = window._pomoLockGrantedCb;
    window._pomoLockGrantedCb = null;
    if (d.granted && typeof cb === 'function') {
      cb();
    } else if (!d.granted) {
      if (hintPill) hintPill.textContent = '⚠️ 请先在系统设置开启「使用情况访问权限」';
    }
  } else if (d.type === 'pomodoro-lock-exit') {
    // 20261105：原生锁机覆盖层「退出锁机」按钮被点 → 同步退出锁机状态（专注继续）
    exitLockOnly();
  }
});

};
// 批量移动：打开目标文件夹选择层
let moveMode = 'bulk';   // 'bulk' 批量移动 | 'folder' 移动整个文件夹记录 | 'single' 单条移动
let moveSingleRid = null;
let moveFolderFid = null;   // folder 模式：源文件夹 id
document.getElementById('bulkMoveBtn').onclick = ()=>{
  if(selectedFolderIds.size===0) return;
  moveMode = 'bulk';
  openMoveSheet();
};
/* 记录列表页「移入文件夹」：把当前文件夹的所有记录移到目标文件夹 */
function openMoveSheetForFolder(fid){
  moveMode = 'folder';
  moveFolderFid = fid;
  openMoveSheet();
}
document.getElementById('moveCancel').onclick = ()=> document.getElementById('moveSheet').classList.remove('show');
document.getElementById('moveSheet').addEventListener('click', (e)=>{ if(e.target===document.getElementById('moveSheet')) document.getElementById('moveSheet').classList.remove('show'); });

function openMoveSheet(){
  const root = document.getElementById('moveList');
  root.innerHTML = '';
  if(moveMode==='bulk'){
    document.getElementById('moveSub').textContent = `将选中的 ${selectedFolderIds.size} 个文件夹移动到…（文件夹不可移动自身）`;
  } else if(moveMode==='folder'){
    const src = folders.find(x=>x.id===moveFolderFid);
    document.getElementById('moveSub').textContent = `将「${src?src.name:''}」里的记录移动到…`;
  } else {
    document.getElementById('moveSub').textContent = '选择目标文件夹';
  }
  let candidates = folders;
  if(moveMode==='bulk') candidates = folders.filter(f=> !selectedFolderIds.has(f.id));
  else if(moveMode==='folder') candidates = folders.filter(f=> f.id!==moveFolderFid);
  if(candidates.length===0){
    root.innerHTML = `<div style="font-size:13px;color:var(--ink2);padding:10px;">没有可移动到的文件夹</div>`;
    document.getElementById('moveSheet').classList.add('show');
    return;
  }
  // 构建 BounceCards 卡片
  const cards = candidates.map(f=>({
    id: f.id,
    name: f.name,
    emoji: f.type==='char' ? (f.emoji||'✨') : '📁',
    avatar: f.avatar || null,
    color: f.color || '#a78bfa'
  }));
  initBounceCards(root, cards, (card)=>{
    const f = candidates.find(x=>x.id===card.id);
    if(!f) return;
    if(moveMode==='bulk'){
      let moved = 0;
      selectedFolderIds.forEach(fid=>{
        if(fid===f.id) return;
        settleRecords.forEach(r=>{ if(r.folderId===fid){ r.folderId = f.id; moved++; } });
      });
      selectedFolderIds.forEach(fid=>{
        const src = folders.find(x=>x.id===fid);
        if(src && src.type==='custom' && !settleRecords.some(r=>r.folderId===fid)){
          folders.splice(folders.indexOf(src),1);
        }
      });
      document.getElementById('moveSheet').classList.remove('show');
      openSettleFolders();
    } else if(moveMode==='folder'){
      settleRecords.forEach(r=>{ if(r.folderId===moveFolderFid){ r.folderId = f.id; } });
      const src = folders.find(x=>x.id===moveFolderFid);
      if(src && src.type==='custom') folders.splice(folders.indexOf(src),1);
      document.getElementById('moveSheet').classList.remove('show');
      openSettleFolders();
    } else {
      const r = settleRecords.find(x=>x.id===moveSingleRid);
      if(r){ r.folderId = f.id; }
      document.getElementById('moveSheet').classList.remove('show');
      openSettleFolders();
    }
  });
  document.getElementById('moveSheet').classList.add('show');
}

/* ============ BounceCards 原生实现（Q弹进入 + hover推开 + 点击弹动） ============ */
const BC_PATTERN = [1, 0.5, -0.3, -1, 0.2, 0.75, -0.6, 0.35, -0.85, 0.1];
function initBounceCards(root, cards, onClick){
  if(cards.length===0) return;
  const count = cards.length;
  const cardSize = 96;
  const spread = Math.min(80, Math.max(44, 300/count));
  const rotation = 10;
  const arc = 0;
  const pushDistance = 90;
  const hoverScale = 1.08;
  const bounciness = 0.6;
  const middle = (count-1)/2;
  const reach = Math.max(1, middle);
  const slots = cards.map((_,i)=>{
    const offset = i - middle;
    return { x: offset*spread, y: arc*(offset/reach)**2, rotate: rotation*BC_PATTERN[i%BC_PATTERN.length] };
  });
  // 生成卡片 DOM（拟物文件夹：标签耳朵 + 翻盖 + emoji + 底部名字）
  const els = cards.map((card,i)=>{
    const el = document.createElement('div');
    el.className = 'bounce-cards__card';
    el.style.zIndex = i+1;
    const tabColor = card.color || '#a78bfa';
    el.style.setProperty('--bc-tab', tabColor);
    const colorHtml = card.color ? `<div class="bc-color" style="background:${card.color};"></div>` : '';
    el.innerHTML = `<div class="bc-tab"></div><div class="bc-cover">${colorHtml}<span class="bc-emoji">${card.avatar ? charFaceHtml(card, 26) : card.emoji}</span></div><span class="bc-name">${card.name}</span>`;
    root.appendChild(el);
    return el;
  });
  // 物理弹簧
  const bodies = cards.map((_,i)=>({ x:slots[i].x, y:slots[i].y, rotate:slots[i].rotate, scale:0, vx:0, vy:0, vr:0, vs:0 }));
  let state = { hovered:-1, time:0, layer:-1 };
  let raf = 0, last = performance.now(), alive = true;
  const step = (value, velocity, target, stiffness, damping, dt)=>{
    const next = velocity + ((target-value)*stiffness - velocity*damping)*dt;
    return [value + next*dt, next];
  };
  const frame = (now)=>{
    raf = 0;
    if(!alive) return;
    const dt = Math.min(1/30, Math.max(1/240, (now-last)/1000));
    last = now; state.time += dt;
    const hovered = state.hovered;
    const popStiffness = 170;
    const popDamping = 2*(1-0.85*bounciness)*Math.sqrt(popStiffness);
    const moveStiffness = 210;
    const moveDamping = 2*0.72*Math.sqrt(moveStiffness);
    const substeps = Math.ceil(dt/(1/240));
    const h = dt/substeps;
    let moving = 0;
    for(let i=0;i<count;i++){
      const el = els[i]; if(!el) continue;
      const card = bodies[i]; const slot = slots[i];
      const appeared = state.time - 0 >= 0.5 + i*0.06;
      let tx = slot.x, ty = slot.y, tr = slot.rotate, ts = appeared ? 1 : 0;
      if(hovered>=0 && appeared){
        if(i===hovered){ ty = slot.y - cardSize*0.04; tr = 0; ts = hoverScale; }
        else { tx = slot.x + Math.sign(i-hovered)*pushDistance; }
      }
      for(let k=0;k<substeps;k++){
        [card.x, card.vx] = step(card.x, card.vx, tx, moveStiffness, moveDamping, h);
        [card.y, card.vy] = step(card.y, card.vy, ty, moveStiffness, moveDamping, h);
        [card.rotate, card.vr] = step(card.rotate, card.vr, tr, moveStiffness, moveDamping, h);
        [card.scale, card.vs] = step(card.scale, card.vs, ts, popStiffness, popDamping, h);
      }
      moving += Math.abs(card.vx)+Math.abs(card.vy)+Math.abs(card.vr)+Math.abs(card.vs)*100
        + Math.abs(tx-card.x)+Math.abs(ty-card.y)+Math.abs(tr-card.rotate)+Math.abs(ts-card.scale)*100 + (appeared?0:1);
      el.style.transform = `translate(-50%,-50%) translate3d(${card.x.toFixed(2)}px,${card.y.toFixed(2)}px,0) rotate(${card.rotate.toFixed(3)}deg) scale(${Math.max(0,card.scale).toFixed(4)})`;
    }
    if(state.layer !== hovered){
      state.layer = hovered;
      els.forEach((el,i)=>{ if(!el) return; el.style.zIndex = i===hovered ? String(count+1) : String(i+1); el.toggleAttribute('data-active', i===hovered); });
    }
    if(moving > 0.02) raf = requestAnimationFrame(frame);
  };
  const wake = ()=>{ if(raf || !alive) return; last = performance.now(); raf = requestAnimationFrame(frame); };
  const pick = (event)=>{
    const rect = root.getBoundingClientRect();
    const px = event.clientX - rect.left - rect.width/2;
    const py = event.clientY - rect.top - rect.height/2;
    let best=-1, distance=Infinity;
    slots.forEach((slot,i)=>{ const gap = Math.abs(px - slot.x); if(gap<distance){ distance=gap; best=i; } });
    if(best<0) return -1;
    const half = cardSize/2;
    if(Math.abs(py - slots[best].y) > half+12 || distance > half+12) return -1;
    if(state.hovered>=0 && state.hovered!==best){
      const cur = slots[state.hovered];
      if(cur && Math.abs(px-cur.x)-distance < 6) return state.hovered;
    }
    return best;
  };
  root.addEventListener('pointermove', e=>{ const n = pick(e); if(n!==state.hovered){ state.hovered=n; wake(); } });
  root.addEventListener('pointerdown', e=>{
    const n = pick(e); if(n!==state.hovered){ state.hovered=n; wake(); }
    // 手势按下：立即 Q 弹按压（跟手）
    const idx = pick(e);
    if(idx>=0 && bodies[idx]) bodies[idx].vs -= 1.6;
    wake();
  });
  root.addEventListener('pointerleave', ()=>{ if(state.hovered!==-1){ state.hovered=-1; wake(); } });
  root.addEventListener('click', e=>{
    const index = pick(e);
    if(index<0) return;
    const card = bodies[index];
    if(card) card.vs -= 2.2;   // 点击弹动（松手时更强一次回弹）
    wake();
    onClick && onClick(cards[index]);
  });
  wake();
}

/* ============ 初始化 ============ */
refreshDisplay();
applyTheme('lilac');
setInterval(updateCvClock, 1000);

/* 20261104：iframe 接入主项目——接收父窗口传来的真实访客数据，替换默认 CHARS */
(function(){
  function applyChars(list){
    if(!Array.isArray(list) || !list.length) return;
    CHARS = list.map(x => ({
      id: x.id,
      name: x.name || 'TA',
      color: x.color || '#8b7a66',
      emoji: x.emoji || '✨',
      avatar: x.avatar || null,
    }));
    // 若当前已选中角色但索引越界，重置
    if(selectedChar !== null && selectedChar >= CHARS.length) selectedChar = null;
    // 20261104：CHARS 就位后恢复历史结算归档（localStorage），刷新不丢
    restoreSettle();
    renderCharGrid();
    renderArt();
    renderAddBtn();
  }
  window.addEventListener('message', (ev)=>{
    const d = ev.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'pomodoro-init'){
      // 父窗口传入：角色列表 + 当前陪伴角色 charId
      applyChars(d.chars || []);
      if(d.currentCharId && CHARS.length){
        const idx = CHARS.findIndex(x => x.id === d.currentCharId);
        if(idx >= 0){ selectedChar = idx; renderCharGrid(); renderArt(); renderAddBtn(); }
      }
      // 专注模式默认（轻陪伴/专注陪伴/深度陪伴）
      if(d.focusMode) focusMode = d.focusMode;
      // 20261104：AI 模式 + 当前角色行程标签（后台「角色做自己的事」事件内容来源）
      aiMode = !!d.aiMode;
      if(Array.isArray(d.charSchedTags) && d.charSchedTags.length) charSchedTags = d.charSchedTags.slice();
      // 20261104：跟随主项目全局主题——映射后 applyTheme 应用已调好的颜色
      if(d.globalTheme){
        const t = GLOBAL_THEME_MAP[d.globalTheme] || 'lilac';
        applyTheme(t);
      }
      // 20261104：番茄钟设置 + 前台互动字卡库（从主项目聊天设置下发）
      if(typeof d.pomodoroFocusMin === 'number'){ focusMin = d.pomodoroFocusMin; }
      if(typeof d.pomodoroBreakMin === 'number'){ breakMin = d.pomodoroBreakMin; }
      if(typeof d.pomodoroNoiseOn === 'boolean'){ defaultNoiseOn = d.pomodoroNoiseOn; }
      if(typeof d.pomodoroLockOn === 'boolean'){ defaultLockOn = d.pomodoroLockOn; }
      if(typeof d.companionInteractMin === 'number'){ compInteractMin = d.companionInteractMin; }
      if(typeof d.companionInteractMax === 'number'){ compInteractMax = d.companionInteractMax; }
      if(Array.isArray(d.companionActions)){ compActions = d.companionActions.slice(); }
      if(Array.isArray(d.companionReplies)){ compReplies = d.companionReplies.slice(); }
    } else if(d.type === 'pomodoro-self-event-result'){
      // 20261104：主项目 AI 生成「角色做自己的事」结果回传，回填对应事件
      if(typeof fillSelfEventResult === 'function') fillSelfEventResult(d.eventId, d.text || '');
    } else if(d.type === 'pomodoro-comp-interact-result'){
      // 20261105：主项目 AI 生成前台互动气泡结果回传，回填气泡
      if(typeof fillCompInteractResult === 'function') fillCompInteractResult(d.eventId, d.lines || []);
    }
  });
  // 若已处于 iframe 环境，主动向父窗口请求初始化数据
  if(window.parent && window.parent !== window){
    window.parent.postMessage({ type: 'pomodoro-ready' }, '*');
  }
})();
</script>
