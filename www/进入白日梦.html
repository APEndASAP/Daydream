<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>白日梦 · 正式数据入口</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0; text-align: center; padding: 28px;
      background: radial-gradient(ellipse at 50% 0%, #2b2340 0%, #1a1626 55%, #121016 100%);
      font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      user-select: none;
    }
    .logo { filter: drop-shadow(0 0 16px rgba(167,139,250,.55)); }
    .title { margin-top: 18px; font-size: 22px; letter-spacing: 8px; text-indent: 8px; font-weight: 300; color: #c4b5fd; }
    .sub { margin-top: 14px; max-width: 420px; font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.72); }
    .sub b { color: #c4b5fd; }
    .btn {
      margin-top: 26px; padding: 12px 34px; border: none; border-radius: 999px;
      background: linear-gradient(135deg, #8b74e8, #a78bfa); color: #fff;
      font-size: 14px; letter-spacing: 2px; cursor: pointer;
    }
    .hint { margin-top: 16px; font-size: 11px; line-height: 1.8; color: rgba(255,255,255,.45); max-width: 420px; }
    .hint b { color: #c4b5fd; }
  </style>
</head>
<body>
  <svg class="logo" width="64" height="64" viewBox="0 0 24 24" fill="none">
    <defs><linearGradient id="bmg" x1="6" y1="2" x2="19" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#8b74e8"/>
    </linearGradient></defs>
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="url(#bmg)"/>
  </svg>
  <div class="title">白日梦</div>
  <div class="sub">正在进入正式数据空间（<b>127.0.0.1:8902</b>）。<br>你的角色、聊天、字卡等全部数据都在这里，一份没丢。</div>
  <button class="btn" id="go">进入白日梦（正式数据）</button>
  <div class="hint">若上方按钮无反应，请复制地址 <b>http://127.0.0.1:8902/</b> 到浏览器打开。</div>
  <script>
    (function () {
      var TARGET = 'http://127.0.0.1:8902/index.html?v=V1.1';
      // 打开即自动跳转
      setTimeout(function () { try { location.replace(TARGET); } catch (e) {} }, 300);
      var btn = document.getElementById('go');
      if (btn) btn.onclick = function () { try { location.replace(TARGET); } catch (e) {} };
    })();
  </script>
</body>
</html>
